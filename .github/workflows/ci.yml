name: CI

on:
  push:
    branches: [main, improvement/**]
  pull_request:

permissions:
  contents: read

# Model files and research videos are private and never available here.
# These jobs cover everything that does not need them.
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.0.13004108
      ORT_VERSION: 1.22.0
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - name: Fetch ONNX Runtime headers
        run: |
          curl -fsSL -o ort.aar "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_VERSION}/onnxruntime-android-${ORT_VERSION}.aar"
          unzip -q ort.aar 'headers/*' -d ort
          {
            echo "SCAN_ORT_INCLUDE=$PWD/ort/headers"
            echo "SCAN_NDK_VERSION=${NDK_VERSION}"
          } >> ~/.gradle/gradle.properties 2>/dev/null || {
            mkdir -p ~/.gradle
            echo "SCAN_ORT_INCLUDE=$PWD/ort/headers" >> ~/.gradle/gradle.properties
            echo "SCAN_NDK_VERSION=${NDK_VERSION}" >> ~/.gradle/gradle.properties
          }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

  python-reference:
    runs-on: ubuntu-latest
    # Not yet verified outside the research machine; failures are reported but do not block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install numpy pandas pyyaml scipy opencv-python-headless pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest backend/tests -q
